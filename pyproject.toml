[project]
name = "printpage"
version = "0.1.1"
description = "A simple web server for printing test pages on label printers"
authors = [
    { name = "James Hodgkinson", email = "james@terminaloutcomes.com" },
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135.2",
    "uvicorn>=0.42.0",
    "jinja2>=3.1.2",
    "weasyprint>=69.0",
    "uvicorn[standard]>=0.42.0",
]
readme = "README.md"

[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = [
    "tests",
    "docs",
    "AGENTS.md",
    "printpage.sh",
    ".gitignore",
]

[tool.hatch.build.targets.wheel]
packages = [
    "printpage",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
    "ty>=0.0.70",
]
